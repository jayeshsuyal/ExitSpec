name: v0.5 Qualification Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  qualification-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: control
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: control/pyproject.toml
      - run: python -m pip install --upgrade pip setuptools wheel
      - run: python -m pip install -e 'control[dev]'
      - name: Run owner-bound qualification harness
        run: python -I control/scripts/run_qualification_control_harness.py candidate/src
      - name: Validate local qualification CLI and assessment
        working-directory: control
        run: python -m pytest -q tests/test_qualification_cli.py tests/test_qualification_assessment.py
