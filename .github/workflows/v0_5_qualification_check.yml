name: v0.5 Qualification Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  qualification-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip setuptools wheel
      - run: python -m pip install -e '.[dev]'
      - name: Validate local qualification CLI and assessment
        run: python -m pytest -q tests/test_qualification_cli.py tests/test_qualification_assessment.py
