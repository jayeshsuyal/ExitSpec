name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip setuptools wheel
      - run: python -m pip install -e '.[dev]'
      - name: Check browser JavaScript syntax
        run: |
          node --check src/exitspec/static/app.js
          node --check src/exitspec/static/review.js
      - name: Prove the built wheel outside the checkout
        run: python -m pytest tests/test_distribution.py
      - name: Run the remaining test suite
        run: python -m pytest --ignore=tests/test_distribution.py
