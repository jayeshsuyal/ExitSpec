name: Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip setuptools wheel
      - run: python -m pip install -e '.[dev]'
      - name: Run the engineering gate
        env:
          EXITSPEC_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: ./scripts/engineering_gate.sh

  browser-e2e:
    name: Browser E2E (Chromium, Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip setuptools wheel
      - run: python -m pip install -e '.[dev,browser]'
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run the mandatory v0.4 no-skip release, browser, and adversarial gate
        env:
          EXITSPEC_BROWSER_E2E: "1"
        # v0.4 invokes the preserved ./scripts/v0_3_release_gate.sh internally.
        run: ./scripts/v0_4_release_gate.sh

  zoom-fixture-operator:
    name: Zoom fixture operator (synthetic only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: npm ci --prefix tools/zoom_fixture_operator
      - run: npm run check --prefix tools/zoom_fixture_operator
      - run: npm test --prefix tools/zoom_fixture_operator
      - run: npm audit --prefix tools/zoom_fixture_operator --audit-level=high
